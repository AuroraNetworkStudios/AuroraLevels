name: Upload Artifacts and Notify Discord

on:
  push:
    branches:
      - main
      - v2

env:
  PLUGIN_NAME: AuroraLevels
  PIXELEAST_PRODUCT_ID: 3348b84c-e329-461a-85c3-dafc3764cd43

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build with Gradle
        run: gradle clean build -PbuildNumber=${{ github.run_number }}

      - name: Build changelog
        run: python3 .github/scripts/dev_build.py changelog

      - name: Read release metadata
        run: python3 .github/scripts/dev_build.py metadata

      - name: Upload to server
        run: python3 .github/scripts/dev_build.py upload-server
        env:
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          SERVER_UPLOAD_URL: ${{ secrets.SERVER_UPLOAD_URL }}

      - name: Upload to PixelEast
        run: python3 .github/scripts/dev_build.py upload-pixeleast
        env:
          PIXELEAST_TOKEN: ${{ secrets.PIXELEAST_TOKEN }}
